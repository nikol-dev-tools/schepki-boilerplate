<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EXTENSION_NAME</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- HEADER -->
  <div class="header">
    <div class="logo">
      <img src="icons/icon48.png" alt="icon" width="24" height="24">
      <span class="title" data-i18n="title">EXTENSION_NAME</span>
    </div>
  </div>

  <!-- MAIN CONTENT — replace this section with your extension's UI -->
  <div class="main-content">
    <p data-i18n="description">Your extension description here.</p>

    <!-- STEP 3: YOUR EXTENSION UI HERE -->
    <!-- Example: button, input, toggle, etc. -->
    <button id="main-action" class="btn-primary" data-i18n="action_button">
      Do Something
    </button>
  </div>

  <!-- DONATE BANNER (shown after 3rd open, hidden initially) -->
  <div id="donate-banner" class="donate-banner hidden">
    <span data-i18n="donate_text">☕ Enjoying this? Buy me a coffee!</span>
    <a id="donate-link" href="#" target="_blank" class="donate-btn" data-i18n="donate_button">Donate</a>
  </div>

  <!-- RATE US PROMPT (shown after N opens, hidden initially) -->
  <div id="rate-us-banner" class="rate-banner hidden">
    <span data-i18n="rate_text">⭐ Loving it? Leave a review!</span>
    <a id="rate-link" href="#" target="_blank" class="rate-btn" data-i18n="rate_button">Rate Us</a>
    <button id="rate-dismiss" class="dismiss-btn" data-i18n="rate_dismiss">Maybe later</button>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <a href="https://nikol-dev-tools.github.io/schepki-config/privacy.html" target="_blank" data-i18n="privacy">Privacy Policy</a>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
